name: Debian 13 original AI analysis
on:
  workflow_dispatch:
    inputs:
      agent:
        description: Original AI Studio agent (requires deployed original runtime)
        required: true
        type: choice
        options: [alex, aria, astyria, aurelius]
      task:
        description: Analysis request (no generated code execution)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: debian13-original-ai-analysis
  cancel-in-progress: false
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout selected project revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Request verified original Ollama analysis
        env:
          AGENT: ${{ inputs.agent }}
          TASK: ${{ inputs.task }}
          ALEX_EXISTING_API_URL: ${{ secrets.DEBIAN13_ORIGINAL_AGENTS_API_URL }}
          ORIGINAL_AGENTS_API_TOKEN: ${{ secrets.DEBIAN13_ORIGINAL_AGENTS_TOKEN }}
          ORIGINAL_AGENTS_ALLOW_REVIEW: "1"
        run: python3 debian13/system/original_agent_plan.py
      - name: Save analysis for operator review
        uses: actions/upload-artifact@v4
        with:
          name: original-ai-analysis
          path: agent-plan.md
          if-no-files-found: error
          retention-days: 7
